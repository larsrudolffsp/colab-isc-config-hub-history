name: Daily ISC Backup (multiple tenants)

on:
  schedule:
    - cron: '0 6 * * *' # Täglich um 06:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tenant:
          - name: lars_demo
            url_secret: TENANT_URL
            client_id_secret: CLIENT_ID
            client_secret_secret: CLIENT_SECRET
          - name: POC_19968
            url_secret: POC_19968_TENANT_URL
            client_id_secret: POC_19968_CLIENT_ID
            client_secret_secret: POC_19968_CLIENT_ID

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Backup for ${{ matrix.tenant.name }}
        env:
          TENANT_URL: ${{ secrets[matrix.tenant.url_secret] }}
          CLIENT_ID: ${{ secrets[matrix.tenant.client_id_secret] }}
          CLIENT_SECRET: ${{ secrets[matrix.tenant.client_secret_secret] }}
        run: |
          npm ci
          node scripts/backup.mjs

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated backup: ${{ matrix.tenant.name }}"

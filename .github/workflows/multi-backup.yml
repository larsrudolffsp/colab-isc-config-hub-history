name: Daily ISC Backup (multiple tenants)

on:
  schedule:
    - cron: '0 6 * * *' # Täglich um 06:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Dependencies
        run: npm ci
      # --- Tenant 1: Lars Demo ---
      - name: Backup Lars Demo
        env:
          TENANT_URL: ${{ secrets.TENANT_URL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: node scripts/backup.mjs
      # --- Tenant 2: POC_19968 ---
      - name: Backup POC_19968
        env:
          TENANT_URL: ${{ secrets.POC_19968_TENANT_URL }}
          CLIENT_ID: ${{ secrets.POC_19968_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.POC_19968_CLIENT_SECRET }}
        run: node scripts/backup.mjs
      # --- Gemeinsamer Commit & Push ---
      - name: Commit and Push All Backups
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated backup: all tenants"

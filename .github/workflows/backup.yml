# Daily backup of ISC configuration, followed by an automatic refresh of
# vars/<tenant>.vars.yaml so token values stay in sync with the latest backup.
name: Daily ISC Backup

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6:00 AM UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run backup
        env:
          TENANT_URL: ${{ secrets.TENANT_URL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: node scripts/backup.mjs

      - name: Refresh vars for backup tenant
        env:
          TENANT_URL: ${{ secrets.TENANT_URL }}
        run: |
          TENANT_NAME=$(node -e "console.log(new URL(process.env.TENANT_URL).hostname.split('.')[0])")
          echo "Refreshing vars for tenant: $TENANT_NAME"
          node scripts/tokenize.mjs seed-vars "$TENANT_NAME"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/ vars/
          if git diff --cached --quiet; then
            echo "No changes detected — skipping commit"
          else
            git commit -m "backup: $(date -u +%Y-%m-%d) ISC configuration snapshot"
            git push
          fi
